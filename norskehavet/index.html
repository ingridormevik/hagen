<!-- V48 ending (Ingrid 19 Nov: "use the one in Downloads ... adjust it to the setting of the garden").
     From "HAGEN_ Easter egg draft.zip" (Downloads, 19 Nov 23:37), adapted: opened from the garden as
     its ending (?embedded=1, no ENTER screen), the garden's own song file, fonts and three.js kept
     locally (works offline), the garden's real weather and language, the line style of the garden,
     and the garden's own forms at the start (pearl membranes, golden mushrooms, glowing roots).
     Opened on its own (no ?embedded) it still works as before, with its ENTER screen. -->
<style>
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:400;font-display:swap;src:url(../assets/fonts/cormorant-garamond-latin-400-normal.woff2) format('woff2')}

/* the garden's line style: the position line's warm colour, each word drawn in with a passing light */
#line .w{display:inline-block;opacity:0;animation:w48 1.8s ease forwards;white-space:pre}
@keyframes w48{0%{opacity:0;transform:translateY(.08em)}55%{opacity:1;text-shadow:0 0 12px rgba(195,208,177,.45),0 1px 10px #000}100%{opacity:1;transform:none}}

#veil{position:fixed;inset:0;background:#000;z-index:9;pointer-events:none;opacity:0;transition:opacity 2.2s ease}
body.embedded #veil{display:none}
body.embedded #intro{display:none}
/* VOICE: tender, slow, cinematic. IDEA: a garden in a bottle in the Norwegian Sea.
   PICTURE: the whole screen is the world. COLOUR: cold pale soil, near-black growth, gold light.
   TYPE: Cormorant Garamond italic. LAYOUT: full-bleed canvas, one line of text at a time. */
html,body{margin:0;height:100%;background:#050607;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
.serif{font-family:'Cormorant Garamond',serif;color:#efe6d2}
#corner{position:fixed;top:18px;right:22px;font-style:italic;font-size:15px;opacity:.7;pointer-events:none;transition:opacity 3s}
#line{white-space:pre-line;position:fixed;left:50%;bottom:14%;transform:translateX(-50%);width:min(86vw,680px);text-align:center;font-size:clamp(21px,1.6vw,26px);font-style:italic;line-height:1.65;color:#e0dcc8;letter-spacing:.01em;opacity:0;transition:opacity 2.4s ease;pointer-events:none;text-shadow:0 1px 10px #000,0 0 24px rgba(0,0,0,.8)}
#intro,#outro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#10151a 0%,#040506 75%);transition:opacity 1.8s ease;z-index:5}
#outro{background:transparent;opacity:0;pointer-events:none;justify-content:flex-start;padding-top:9vh}
h1{font-weight:400;letter-spacing:.42em;font-size:clamp(28px,5vw,46px);margin:0 0 6px;padding-left:.42em}
.sub{font-style:italic;opacity:.7;font-size:17px;margin-bottom:34px}
button{font-family:inherit;font-size:17px;letter-spacing:.2em;color:#efe6d2;background:transparent;border:1px solid rgba(232,194,122,.55);padding:11px 30px;min-height:44px;cursor:pointer;border-radius:2px}
button:hover,button:focus-visible{background:rgba(232,194,122,.12);outline:none}
.hint{margin-top:26px;font-size:14px;opacity:.5;font-style:italic;text-align:center;line-height:1.6}
/* 24 Nov (Ingrid's V50 brief, "clear ways to ... leave or return"): the way back while the shell film plays, quiet like the
   weather line in the other corner. Shown only when opened from the garden; hidden again when RETURN TO THE GARDEN appears. */
#back{display:none;position:fixed;top:12px;left:14px;z-index:6;border:0;padding:10px 12px;min-height:44px;font-size:15px;font-style:italic;letter-spacing:.04em;opacity:.6;transition:opacity .6s}
#back.on{display:block}
#back:hover,#back:focus-visible{opacity:1}

<script type="module">
import * as THREE from 'three';

const EARTH={c:tex('assets/realm/earth_color.jpg',true),n:tex('assets/realm/earth_normal.jpg')},BARK={c:tex('assets/realm/bark_color.jpg',true,1),n:tex('assets/realm/bark_normal.jpg',false,1)},STONE={c:tex('assets/realm/stone_color.jpg',true),n:tex('assets/realm/stone_normal.jpg')};

function softTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.22,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
